[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guadalajara-operations"
version = "0.1.0"
description = "Operational data foundation for the Restaurante Guadalajara digital twin"
requires-python = ">=3.11"
dependencies = ["simpy==4.1.2"]

[tool.setuptools.packages.find]
include = ["operations*"]

[tool.setuptools.package-data]
operations = ["adapters/*.html"]
